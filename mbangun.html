<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Stacker - Best Version</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-color: #1b1b2f;
            --text-main: #eee;
            --accent: #e43f5a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f1a;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background-color: var(--bg-color);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
        }

        /* --- UI STYLING --- */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(27, 27, 47, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            background: linear-gradient(45deg, #e43f5a, #4c7ffd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 { font-size: 1rem; color: #aaa; font-weight: 300; margin-top: 10px; letter-spacing: 5px; }
        p { color: #888; margin: 20px 0 40px; font-size: 0.9rem; }

        button {
            padding: 15px 50px;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #e43f5a, #ff6b6b);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(228, 63, 90, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(228, 63, 90, 0.3); }

        /* HUD */
        #hud {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        
        #scoreVal {
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
            display: block;
            transition: color 0.2s;
        }
        
        #bonusText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #4c7ffd;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(76, 127, 253, 0.5);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <span id="scoreVal">0</span>
        </div>
        <div id="bonusText">PERFECT!</div>

        <div id="startScreen" class="overlay">
            <h2>ENDLESS ARCADE</h2>
            <h1>Stacker</h1>
            <p>Tumpuk setinggi mungkin.<br>Tumpukan akan menurun otomatis.</p>
            <button id="startBtn">START</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h2>GAME OVER</h2>
            <h1 style="font-size: 2rem; margin-bottom: 20px;">SKOR: <span id="finalScore">0</span></h1>
            <p>Best Score: <span id="highScore">0</span></p>
            <button id="restartBtn">RETRY</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- SETUP ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            let W, H;
            function resizeCanvas() {
                W = $('#gameContainer').width();
                H = $('#gameContainer').height();
                canvas.width = W;
                canvas.height = H;
            }
            resizeCanvas();
            $(window).on('resize', resizeCanvas);

            // --- STATE ---
            let state = 'MENU';
            let score = 0;
            let highScore = localStorage.getItem('skyStackerHigh') || 0;
            
            // --- CONFIG ---
            const BLOCK_HEIGHT = 40;
            let blocks = [];
            let currentBlock = null;
            let fallingPieces = [];
            let particles = [];
            
            // Camera System
            let cameraY = 0; 
            let targetCameraY = 0;
            
            // Colors
            let hue = 200; // Start Blue

            // --- LOGIC ---

            function initGame() {
                blocks = [];
                fallingPieces = [];
                particles = [];
                score = 0;
                hue = 200;
                cameraY = 0;
                targetCameraY = 0;
                
                // Base Block
                const w = 180;
                blocks.push({
                    x: W/2 - w/2,
                    y: H - 200,
                    width: w,
                    color: '#fff',
                    outline: false
                });

                spawnNewBlock();
                $('#scoreVal').text(0).css('color', 'rgba(255,255,255,0.1)');
            }

            function spawnNewBlock() {
                const lastBlock = blocks[blocks.length - 1];
                
                // Kamera target mengikuti blok terakhir
                // Rumus: Kamera berada 30% dari atas blok terakhir
                targetCameraY = lastBlock.y - (H * 0.3);

                // New Block Position (Di atas last block)
                const newY = lastBlock.y - BLOCK_HEIGHT;
                
                currentBlock = {
                    x: -lastBlock.width, // Spawn kiri luar
                    y: newY,
                    width: lastBlock.width,
                    color: `hsl(${hue}, 70%, 60%)`,
                    direction: 1,
                    speed: 3 + (score * 0.15), // Speed naik seiring skor
                    outline: true
                };
            }

            function placeBlock() {
                if (!currentBlock) return;

                const lastBlock = blocks[blocks.length - 1];
                
                // 1. Overlap Calculation
                const overlapStart = Math.max(currentBlock.x, lastBlock.x);
                const overlapEnd = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
                const overlapWidth = overlapEnd - overlapStart;

                // 2. Miss Total
                if (overlapWidth <= 0) {
                    createFallingPiece(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.color);
                    currentBlock = null;
                    gameOver();
                    return;
                }

                // 3. Success Logic
                // Check Perfect Drop (Toleransi 5 pixel)
                const isPerfect = Math.abs(currentBlock.x - lastBlock.x) < 5;
                
                let finalX = overlapStart;
                let finalWidth = overlapWidth;

                if (isPerfect) {
                    // Jika perfect, balok tidak di-potong, tapi mengikuti ukuran blok bawah
                    finalX = lastBlock.x;
                    finalWidth = lastBlock.width;
                    showBonus("PERFECT!", "+20");
                    score += 20; // Bonus instant
                    createParticles(currentBlock.x + currentBlock.width/2, currentBlock.y, '#fff');
                }

                // Potong sisa (jika tidak perfect)
                if (!isPerfect && overlapWidth < currentBlock.width) {
                    const isLeft = currentBlock.x < lastBlock.x;
                    const cutX = isLeft ? currentBlock.x : overlapEnd;
                    const cutW = isLeft ? lastBlock.x - currentBlock.x : (currentBlock.x + currentBlock.width) - overlapEnd;
                    
                    createFallingPiece(cutX, currentBlock.y, cutW, currentBlock.color);
                    createParticles(cutX + cutW/2, currentBlock.y, currentBlock.color);
                }

                // Add new stacked block
                blocks.push({
                    x: finalX,
                    y: currentBlock.y,
                    width: finalWidth,
                    color: currentBlock.color,
                    outline: false
                });

                score += 10;
                $('#scoreVal').text(score);
                
                // Change Color
                hue = (hue + 15) % 360;

                currentBlock = null;
                
                // Clean up memory: Hapus blok yang sudah jauh di bawah kamera
                // Logika: Jika Y blok > Y Kamera + Tinggi Layar, hapus.
                // Ini membuat "Endless Conveyor" effect
                for(let i=blocks.length-1; i>=0; i--) {
                    if (blocks[i].y > cameraY + H + 100) {
                        blocks.splice(i, 1);
                    }
                }

                spawnNewBlock();
            }

            function createFallingPiece(x, y, w, color) {
                if(w <= 0) return;
                fallingPieces.push({
                    x: x, y: y, width: w, height: BLOCK_HEIGHT,
                    color: color, vy: 0, vx: (Math.random()-0.5)*4,
                    rotation: 0, vr: (Math.random()-0.5)*0.2
                });
            }

            function createParticles(x, y, color) {
                for(let i=0; i<10; i++) {
                    particles.push({
                        x: x, y: y,
                        vx: (Math.random()-0.5)*6,
                        vy: (Math.random()-0.5)*6,
                        size: Math.random()*4 + 2,
                        life: 1.0,
                        color: color
                    });
                }
            }

            function showBonus(text, scoreText) {
                const $bonus = $('#bonusText');
                $bonus.stop().css({opacity: 1, top: '50%', transform: 'translate(-50%, -50%) scale(1.5)'})
                    .text(text)
                    .animate({top: '40%', opacity: 0}, 500);
            }

            function update() {
                if (state !== 'PLAYING') return;

                // Camera Follow (Smooth)
                cameraY += (targetCameraY - cameraY) * 0.1;

                // Move Current Block
                if (currentBlock) {
                    currentBlock.x += currentBlock.speed * currentBlock.direction;
                    if (currentBlock.x + currentBlock.width > W || currentBlock.x < 0) {
                        currentBlock.direction *= -1;
                    }
                }

                // Physics for falling pieces
                for (let i = fallingPieces.length - 1; i >= 0; i--) {
                    let p = fallingPieces[i];
                    p.vy += 0.5; // Gravity
                    p.y += p.vy;
                    p.x += p.vx;
                    p.rotation += p.vr;
                    if (p.y > H + 100) fallingPieces.splice(i, 1);
                }

                // Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function draw() {
                // Background Gradient
                let grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1b1b2f');
                grad.addColorStop(1, '#16213e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                ctx.save();
                // Apply Camera
                ctx.translate(0, -cameraY);

                // Draw Grid Lines (untuk efek gerak)
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                let gridStartY = Math.floor(cameraY / 50) * 50;
                for(let y = gridStartY; y < cameraY + H; y+=50) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                }

                // Draw Stacked Blocks
                for (let b of blocks) {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, BLOCK_HEIGHT);
                    // Highlight
                    ctx.fillStyle = "rgba(255,255,255,0.3)";
                    ctx.fillRect(b.x, b.y, b.width, 4);
                    // Outline
                    if(b.outline) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(b.x, b.y, b.width, BLOCK_HEIGHT);
                    }
                }

                // Draw Current Block
                if (currentBlock) {
                    ctx.fillStyle = currentBlock.color;
                    ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, BLOCK_HEIGHT);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(currentBlock.x, currentBlock.y, currentBlock.width, BLOCK_HEIGHT);
                    
                    // Shadow guide
                    ctx.fillStyle = "rgba(0,0,0,0.2)";
                    ctx.fillRect(currentBlock.x, currentBlock.y+BLOCK_HEIGHT, currentBlock.width, 5);
                }

                // Draw Falling
                for (let p of fallingPieces) {
                    ctx.save();
                    ctx.translate(p.x + p.width/2, p.y + p.height/2);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                    ctx.restore();
                }

                // Draw Particles
                for (let p of particles) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
                ctx.globalAlpha = 1.0;

                ctx.restore();
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // --- EVENTS ---
            function handleInput() {
                if (state === 'PLAYING') placeBlock();
            }

            $('#gameContainer').on('mousedown touchstart', function(e) {
                if ($(e.target).is('button')) return;
                e.preventDefault();
                handleInput();
            });

            $(document).on('keydown', (e) => {
                if (e.code === 'Space' && state === 'PLAYING') {
                    e.preventDefault();
                    handleInput();
                }
            });

            $('#startBtn').click((e) => { e.stopPropagation(); startGame(); });
            $('#restartBtn').click((e) => { e.stopPropagation(); startGame(); });

            function startGame() {
                state = 'PLAYING';
                initGame();
                $('#startScreen').addClass('hidden');
                $('#gameOverScreen').addClass('hidden');
                $('#hud').removeClass('hidden');
            }

            function gameOver() {
                state = 'GAMEOVER';
                currentBlock = null;
                
                setTimeout(() => {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('skyStackerHigh', highScore);
                    }
                    $('#finalScore').text(score);
                    $('#highScore').text(highScore);
                    $('#gameOverScreen').removeClass('hidden');
                    $('#hud').addClass('hidden');
                }, 600);
            }

            loop();
        });
    </script>
</body>
</html>
