<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Stacker</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-sky: #ebf2fa;
            --text-main: #2b2d42;
            --ui-bg: rgba(255, 255, 255, 0.9);
            --accent: #ef233c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #8d99ae;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 700px;
            background-color: var(--bg-sky);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            user-select: none;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: var(--text-main);
            text-align: center;
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 800;
            color: #2b2d42;
            letter-spacing: -2px;
        }
        h2 { font-size: 1rem; color: #8d99ae; text-transform: uppercase; letter-spacing: 2px; }

        p { color: #555; margin: 10px 0 30px; line-height: 1.5; }

        button {
            padding: 15px 40px;
            font-size: 1rem;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 4px 0 #ef233c;
            position: relative;
            z-index: 20; /* Ensure button is on top */
        }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 #ef233c; }

        #hud {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        
        #scoreDisplay {
            font-size: 4rem;
            font-weight: 900;
            color: rgba(43, 45, 66, 0.1);
            position: absolute;
            width: 100%;
            top: 20px;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div id="scoreDisplay">0</div>
        </div>

        <div id="startScreen" class="overlay">
            <h2>Paper Games</h2>
            <h1>STACKER</h1>
            <p>Tumpuk kertas dengan tepat.<br>Blok yang tidak pas akan terpotong.</p>
            <button id="startBtn">MAIN</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h2>Permainan Selesai</h2>
            <h1 style="font-size: 2rem; margin-bottom: 10px;">Tumpukan Jatuh!</h1>
            <p>Skor Akhir: <b><span id="finalScore">0</span></b></p>
            <p style="font-size: 0.8rem; color: #aaa;">Rekor: <span id="highScore">0</span></p>
            <button id="restartBtn">ULANGI</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- SETUP CANVAS ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            let W, H;
            function resizeCanvas() {
                W = $('#gameContainer').width();
                H = $('#gameContainer').height();
                canvas.width = W;
                canvas.height = H;
            }
            resizeCanvas();
            $(window).on('resize', resizeCanvas);

            // --- GAME STATE ---
            let state = 'MENU';
            let score = 0;
            let highScore = localStorage.getItem('paperStackHigh') || 0;
            let canPlace = true; // Flag untuk mencegah double click
            
            // --- CONFIG ---
            const BLOCK_HEIGHT = 40;
            const INITIAL_WIDTH = 200;
            
            // --- OBJECTS ---
            let blocks = [];
            let currentBlock = null;
            let fallingPieces = [];
            let cameraY = 0;
            let targetCameraY = 0;
            
            // Movement
            let baseSpeed = 3.5;
            let speed = baseSpeed;

            // --- PALETTE ---
            const colors = ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#d62828', '#f77f00'];

            function getRandomColor(index) {
                return colors[index % colors.length];
            }

            // --- LOGIC ---

            function initGame() {
                blocks = [];
                fallingPieces = [];
                score = 0;
                cameraY = 0;
                targetCameraY = 0;
                speed = baseSpeed;
                canPlace = true;
                
                // Base Block
                const baseY = H - 150; 
                const baseX = W / 2 - INITIAL_WIDTH / 2;
                
                blocks.push({
                    x: baseX,
                    y: baseY,
                    width: INITIAL_WIDTH,
                    color: '#f0f0f0',
                    hasShadow: false
                });

                spawnNewBlock();
                $('#scoreDisplay').text(0);
            }

            function spawnNewBlock() {
                const lastBlock = blocks[blocks.length - 1];
                const newY = lastBlock.y - BLOCK_HEIGHT;
                
                // PERBAIKAN 1: Spawn blok di tepi kiri layar (x=0), bukan di luar layar.
                // Ini memastikan pemain melihat blok sejak awal.
                // Blok akan bergerak ke kanan.
                
                currentBlock = {
                    x: 0, 
                    y: newY,
                    width: lastBlock.width,
                    color: getRandomColor(score),
                    direction: 1,
                    hasShadow: true
                };
            }

            function placeBlock() {
                if (!currentBlock || !canPlace) return;

                const lastBlock = blocks[blocks.length - 1];
                
                // 1. Hitung Overlap
                const overlapStart = Math.max(currentBlock.x, lastBlock.x);
                const overlapEnd = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
                const overlapWidth = overlapEnd - overlapStart;

                // 2. Cek Miss Total
                if (overlapWidth <= 0) {
                    // Miss! Tidak ada yang numpuk.
                    // Pastikan kita membuat falling piece agar pemain tahu salahnya di mana.
                    createFallingPiece(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.color);
                    currentBlock = null;
                    gameOver();
                    return;
                }

                // 3. Success
                canPlace = false; // Prevent spamming clicks
                
                // 3a. Potong bagian yang jatuh
                if (overlapWidth < currentBlock.width) {
                    let cutX, cutWidth;
                    const isLeftoverLeft = currentBlock.x < lastBlock.x;
                    
                    if (isLeftoverLeft) {
                        cutX = currentBlock.x;
                        cutWidth = lastBlock.x - currentBlock.x;
                    } else {
                        cutX = overlapEnd;
                        cutWidth = (currentBlock.x + currentBlock.width) - overlapEnd;
                    }
                    createFallingPiece(cutX, currentBlock.y, cutWidth, currentBlock.color);
                }

                // 3b. Buat blok baru yang pas
                const newBlock = {
                    x: overlapStart,
                    y: currentBlock.y,
                    width: overlapWidth,
                    color: currentBlock.color,
                    hasShadow: true
                };
                
                blocks.push(newBlock);
                score++;
                $('#scoreDisplay').text(score);

                if (score % 5 === 0) speed += 0.25;

                targetCameraY = newBlock.y - (H / 2);

                currentBlock = null;
                
                // Delay sedikit sebelum spawn baru untuk memastikan animasi jalan
                setTimeout(() => {
                    spawnNewBlock();
                    canPlace = true;
                }, 100);
            }

            function createFallingPiece(x, y, w, color) {
                if (w <= 0) return;
                fallingPieces.push({
                    x: x,
                    y: y,
                    width: w,
                    height: BLOCK_HEIGHT,
                    color: color,
                    velY: 0,
                    velX: (Math.random() - 0.5) * 4,
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.3
                });
            }

            function update() {
                if (state !== 'PLAYING') return;

                if (currentBlock) {
                    currentBlock.x += speed * currentBlock.direction;

                    // Logika Pantul: Pindah ke kiri/kanan saat menyentuh pinggir
                    // Karena spawn di x=0, kita handle pantulan kanan dulu
                    
                    // Jika menyentuh kanan
                    if (currentBlock.x + currentBlock.width > W) {
                        currentBlock.x = W - currentBlock.width;
                        currentBlock.direction = -1; // Balik kiri
                    } 
                    // Jika menyentuh kiri
                    else if (currentBlock.x < 0) {
                        currentBlock.x = 0;
                        currentBlock.direction = 1; // Balik kanan
                    }
                }

                // Fisika Jatuh
                for (let i = fallingPieces.length - 1; i >= 0; i--) {
                    let p = fallingPieces[i];
                    p.velY += 0.6;
                    p.y += p.velY;
                    p.x += p.velX;
                    p.rotation += p.rotSpeed;

                    if (p.y > H + 200) { // Hapus jika sudah jauh di bawah
                        fallingPieces.splice(i, 1);
                    }
                }

                // Kamera
                if (cameraY < targetCameraY) {
                    cameraY += (targetCameraY - cameraY) * 0.1;
                }
            }

            function draw() {
                ctx.fillStyle = "#ebf2fa";
                ctx.fillRect(0, 0, W, H);

                ctx.save();
                ctx.translate(0, -cameraY);

                // Draw Stacked Blocks
                for (let b of blocks) {
                    drawBlock(b.x, b.y, b.width, BLOCK_HEIGHT, b.color, b.hasShadow);
                }

                // Draw Moving Block
                if (currentBlock) {
                    drawBlock(currentBlock.x, currentBlock.y, currentBlock.width, BLOCK_HEIGHT, currentBlock.color, true);
                }

                // Draw Falling Pieces
                for (let p of fallingPieces) {
                    ctx.save();
                    ctx.translate(p.x + p.width/2, p.y + p.height/2);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    // Shadow for falling piece
                    ctx.fillStyle = "rgba(0,0,0,0.2)";
                    ctx.fillRect(-p.width/2 + 5, -p.height/2 + 5, p.width, p.height);
                    // Main
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                    ctx.restore();
                }

                ctx.restore();
            }

            function drawBlock(x, y, w, h, color, shadow) {
                if (shadow) {
                    ctx.fillStyle = "rgba(0,0,0,0.1)";
                    ctx.fillRect(x + 3, y + 3, w, h);
                }
                ctx.fillStyle = color;
                ctx.fillRect(x, y, w, h);
                // Highlight
                ctx.fillStyle = "rgba(255,255,255,0.2)";
                ctx.fillRect(x, y, w, 3);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // --- EVENTS ---
            
            // PERBAIKAN UTAMA: Memisahkan event Start dan Game Click
            // agar klik tombol start tidak langsung memicu 'placeBlock'

            function handleGameClick(e) {
                // Jika event berasal dari tombol UI, abaikan
                if ($(e.target).is('button')) return;
                
                e.preventDefault(); // Prevent scroll/zoom
                if (state === 'PLAYING') {
                    placeBlock();
                }
            }

            $('#gameContainer').on('mousedown touchstart', handleGameClick);

            $(document).on('keydown', function(e) {
                if (e.code === 'Space') {
                    if (state === 'PLAYING') {
                        e.preventDefault();
                        placeBlock();
                    }
                }
            });

            $('#startBtn').click(function(e) {
                e.stopPropagation(); // Penting: hentikan event agar tidak ke container
                startGame();
            });

            $('#restartBtn').click(function(e) {
                e.stopPropagation();
                startGame();
            });

            function startGame() {
                state = 'PLAYING';
                initGame();
                $('#startScreen').addClass('hidden');
                $('#gameOverScreen').addClass('hidden');
                $('#hud').removeClass('hidden');
            }

            function gameOver() {
                state = 'GAMEOVER';
                currentBlock = null;
                
                setTimeout(() => {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('paperStackHigh', highScore);
                    }
                    $('#finalScore').text(score);
                    $('#highScore').text(highScore);
                    $('#gameOverScreen').removeClass('hidden');
                    $('#hud').addClass('hidden');
                }, 500);
            }

            loop();
        });
    </script>
</body>
</html>
