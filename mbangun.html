<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless Stacker</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-main: #333;
            --accent: #ff5e5e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 700px;
            background-color: var(--bg-color);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        /* UI */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: var(--text-main);
            text-align: center;
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 900;
            color: #222;
        }
        p { color: #666; margin: 10px 0 30px; line-height: 1.6; }

        button {
            padding: 15px 40px;
            font-size: 1rem;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        
        #scoreDisplay {
            font-size: 4rem;
            font-weight: 900;
            color: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div id="scoreDisplay">0</div>
        </div>

        <div id="startScreen" class="overlay">
            <h1>ENDLESS<br>STACKER</h1>
            <p>Tumpuk balok setinggi mungkin.<br>Tumpukan akan turun otomatis.</p>
            <button id="startBtn">MULAI</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: #ff5e5e;">GAME OVER</h1>
            <p>Skor Akhir: <b><span id="finalScore">0</span></b></p>
            <p style="font-size: 0.8rem; color: #aaa;">Rekor: <span id="highScore">0</span></p>
            <button id="restartBtn">ULANGI</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- SETUP CANVAS ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            let W, H;
            function resizeCanvas() {
                W = $('#gameContainer').width();
                H = $('#gameContainer').height();
                canvas.width = W;
                canvas.height = H;
            }
            resizeCanvas();
            $(window).on('resize', resizeCanvas);

            // --- GAME STATE ---
            let state = 'MENU';
            let score = 0;
            let highScore = localStorage.getItem('endlessStackHigh') || 0;
            
            // --- CONFIG ---
            const BLOCK_HEIGHT = 40;
            const INITIAL_WIDTH = 200;
            
            // --- OBJECTS ---
            let blocks = [];
            let currentBlock = null;
            let fallingPieces = [];
            
            // --- CAMERA LOGIC ---
            // Camera Y adalah offset geser layar. 
            // Nilainya positif berarti menggeser pandangan ke BAWAH.
            let cameraY = 0; 
            let targetCameraY = 0;
            
            // --- PALETTE ---
            const colors = ['#4ecdc4', '#ff6b6b', '#ffe66d', '#95e1d3', '#f38181', '#aa96da'];

            function getRandomColor(index) {
                return colors[index % colors.length];
            }

            // --- LOGIC ---

            function initGame() {
                blocks = [];
                fallingPieces = [];
                score = 0;
                cameraY = 0;
                targetCameraY = 0;
                
                // Base Block (Platform awal)
                // Posisi Y awal di tengah bawah layar
                const baseY = H - 200; 
                const baseX = W / 2 - INITIAL_WIDTH / 2;
                
                blocks.push({
                    x: baseX,
                    y: baseY,
                    width: INITIAL_WIDTH,
                    color: '#dfe6e9'
                });

                spawnNewBlock();
                $('#scoreDisplay').text(0);
            }

            function spawnNewBlock() {
                const lastBlock = blocks[blocks.length - 1];
                
                // Blok baru spawn di atas blok terakhir (Y lebih kecil)
                // Tapi kita spawn agak jauh di atas (misal 150px di atas last block)
                // Agar terlihat jelas oleh player sebelum "mendarat"
                
                // Namun untuk gameplay sederhana, spawn di Y yang fixed relatif terhadap kamera lebih mudah
                // Y spawn = Posisi Kamera Sekarang + 100px dari atas
                let spawnY = (cameraY - 150); 

                // Pastikan spawn di atas block terakhir
                if (spawnY > lastBlock.y - BLOCK_HEIGHT - 50) {
                    spawnY = lastBlock.y - BLOCK_HEIGHT - 50;
                }

                currentBlock = {
                    x: -lastBlock.width, // Mulai dari luar kiri
                    y: spawnY,
                    width: lastBlock.width,
                    color: getRandomColor(score),
                    direction: 1, // Ke kanan
                    speed: 3 + (score * 0.1)
                };
            }

            function placeBlock() {
                if (!currentBlock) return;

                const lastBlock = blocks[blocks.length - 1];
                
                // 1. Hitung Overlap
                const overlapStart = Math.max(currentBlock.x, lastBlock.x);
                const overlapEnd = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
                const overlapWidth = overlapEnd - overlapStart;

                // 2. Cek Miss Total
                if (overlapWidth <= 0) {
                    createFallingPiece(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.color);
                    currentBlock = null;
                    gameOver();
                    return;
                }

                // 3. Success
                // Tentukan posisi Y baru yang pas (menempel di atas blok sebelumnya)
                const newY = lastBlock.y - BLOCK_HEIGHT;
                
                // 3a. Potong bagian yang jatuh
                if (overlapWidth < currentBlock.width) {
                    let cutX, cutWidth;
                    const isLeftoverLeft = currentBlock.x < lastBlock.x;
                    
                    if (isLeftoverLeft) {
                        cutX = currentBlock.x;
                        cutWidth = lastBlock.x - currentBlock.x;
                    } else {
                        cutX = overlapEnd;
                        cutWidth = (currentBlock.x + currentBlock.width) - overlapEnd;
                    }
                    createFallingPiece(cutX, currentBlock.y, cutWidth, currentBlock.color);
                }

                // 3b. Buat blok baru yang pas
                const newBlock = {
                    x: overlapStart,
                    y: newY,
                    width: overlapWidth,
                    color: currentBlock.color
                };
                
                blocks.push(newBlock);
                score++;
                $('#scoreDisplay').text(score);

                // 4. UPDATE KAMERA (LOGIKA UTAMA PERBAIKAN)
                // Kita ingin blok baru ini selalu terlihat di layar.
                // Target kamera adalah geser pandangan agar blok baru ada di tengah-tengah layar.
                // Rumus: Target = Posisi Blok Baru - (Tinggi Layar / 2)
                // Karena Y blok semakin kecil (naik), targetCameraY akan ikut mengecil (naik).
                // Kita balik logikanya: cameraY adalah offset positif untuk menggeser ke bawah.
                // Jadi targetCameraY = (Tinggi Layar/2) - newBlock.y;
                
                targetCameraY = (H / 2) - newBlock.y;

                currentBlock = null;
                
                // Jika tumpukan sudah terlalu banyak, hapus yang paling bawah untuk hemat memori
                if (blocks.length > 20) {
                    blocks.shift(); 
                }

                spawnNewBlock();
            }

            function createFallingPiece(x, y, w, color) {
                if (w <= 0) return;
                fallingPieces.push({
                    x: x, y: y, width: w, height: BLOCK_HEIGHT,
                    color: color, velY: 0, velX: (Math.random() - 0.5) * 4, 
                    rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.3
                });
            }

            function update() {
                if (state !== 'PLAYING') return;

                // 1. Gerakkan Kamera (Smooth Scroll)
                // Kamera akan bergerak pelan mengikuti target
                // Ini menciptakan efek "turun" secara visual
                if (cameraY < targetCameraY) {
                    // Kecepatan gerak kamera
                    cameraY += (targetCameraY - cameraY) * 0.1;
                }

                // 2. Gerakkan Current Block
                if (currentBlock) {
                    currentBlock.x += currentBlock.speed * currentBlock.direction;

                    // Pantulan
                    if (currentBlock.x + currentBlock.width > W) {
                        currentBlock.x = W - currentBlock.width;
                        currentBlock.direction = -1;
                    } else if (currentBlock.x < 0) {
                        currentBlock.x = 0;
                        currentBlock.direction = 1;
                    }
                }

                // 3. Fisika Jatuh
                for (let i = fallingPieces.length - 1; i >= 0; i--) {
                    let p = fallingPieces[i];
                    p.velY += 0.5;
                    p.y += p.velY;
                    p.x += p.velX;
                    p.rotation += p.rotSpeed;
                    // Hapus jika sudah jauh di bawah kamera/pandangan
                    if (p.y > cameraY + H + 100) {
                        fallingPieces.splice(i, 1);
                    }
                }
            }

            function draw() {
                // Background
                ctx.fillStyle = "#f0f0f0";
                ctx.fillRect(0, 0, W, H);

                ctx.save();
                
                // TERAPKAN KAMERA
                // Konsep: Kita "geser" kanvas ke bawah sebesar cameraY.
                // Ini membuat semua objek yang koordinat Y-nya kecil (di atas) terlihat turun ke tengah layar.
                // Karena koordinat canvas Y=0 di atas, untuk menggeser tampilan ke bawah, kita translate positif.
                ctx.translate(0, cameraY);

                // Gambar Grid (Agar terasa bergerak)
                // Kita gambar grid relatif terhadap dunia, bukan layar, agar terasa bergerak
                ctx.strokeStyle = "#e0e0e0";
                ctx.lineWidth = 1;
                // Ambil offset grid agar mulus
                let gridOffset = cameraY % 50; 
                for (let y = -gridOffset; y < H + 50; y += 50) {
                     ctx.beginPath(); ctx.moveTo(0, y - cameraY); ctx.lineTo(W, y - cameraY); ctx.stroke();
                }
                for (let x = 0; x < W; x += 50) {
                     ctx.beginPath(); ctx.moveTo(x, -cameraY); ctx.lineTo(x, H); ctx.stroke();
                }
                // Reset warna
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.setLineDash([5, 5]);
                 // Garis bantu "base line" awal (opsional, bisa dihapus)
                ctx.beginPath(); ctx.moveTo(0, H-200); ctx.lineTo(W, H-200); ctx.stroke();
                ctx.setLineDash([]);


                // Gambar Stacked Blocks
                for (let b of blocks) {
                    drawBlock(b.x, b.y, b.width, BLOCK_HEIGHT, b.color);
                }

                // Gambar Current Block
                if (currentBlock) {
                    drawBlock(currentBlock.x, currentBlock.y, currentBlock.width, BLOCK_HEIGHT, currentBlock.color);
                }

                // Gambar Falling Pieces
                for (let p of fallingPieces) {
                    ctx.save();
                    ctx.translate(p.x + p.width/2, p.y + p.height/2);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                    ctx.restore();
                }

                ctx.restore();
            }

            function drawBlock(x, y, w, h, color) {
                // Shadow
                ctx.fillStyle = "rgba(0,0,0,0.1)";
                ctx.fillRect(x + 2, y + 2, w, h);
                // Main
                ctx.fillStyle = color;
                ctx.fillRect(x, y, w, h);
                // Highlight
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.fillRect(x, y, w, 4);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // --- EVENTS ---
            function handleGameClick(e) {
                if ($(e.target).is('button')) return;
                e.preventDefault();
                if (state === 'PLAYING') {
                    placeBlock();
                }
            }

            $('#gameContainer').on('mousedown touchstart', handleGameClick);

            $(document).on('keydown', function(e) {
                if (e.code === 'Space') {
                    if (state === 'PLAYING') {
                        e.preventDefault();
                        placeBlock();
                    }
                }
            });

            $('#startBtn').click(function(e) {
                e.stopPropagation();
                startGame();
            });

            $('#restartBtn').click(function(e) {
                e.stopPropagation();
                startGame();
            });

            function startGame() {
                state = 'PLAYING';
                initGame();
                $('#startScreen').addClass('hidden');
                $('#gameOverScreen').addClass('hidden');
                $('#hud').removeClass('hidden');
            }

            function gameOver() {
                state = 'GAMEOVER';
                currentBlock = null;
                
                setTimeout(() => {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('endlessStackHigh', highScore);
                    }
                    $('#finalScore').text(score);
                    $('#highScore').text(highScore);
                    $('#gameOverScreen').removeClass('hidden');
                    $('#hud').addClass('hidden');
                }, 500);
            }

            loop();
        });
    </script>
</body>
</html>
