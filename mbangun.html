<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Master</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-color: #222;
            --wood-color: #8d5524;
            --wood-dark: #5c3d2e;
            --dart-color: #e0e0e0;
            --accent: #ff4757;
            --text-main: #fff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 700px;
            background: radial-gradient(circle at center, #2a2a2a, #111);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* UI */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            text-align: center;
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        p { color: #aaa; margin: 10px 0 30px; }

        button {
            padding: 15px 50px;
            font-size: 1.2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #c0392b;
            transition: transform 0.1s;
        }
        button:active { transform: translateY(5px); box-shadow: 0 0 0 #c0392b; }

        /* HUD */
        #hud {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
        }
        
        #dartIndicator {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 5px;
            z-index: 5;
            pointer-events: none;
        }
        .dart-icon {
            width: 8px;
            height: 25px;
            background: #555;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .dart-icon.active { background: var(--dart-color); }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div>LEVEL <span id="levelDisplay">1</span></div>
            <div>SKOR <span id="scoreDisplay">0</span></div>
        </div>

        <div id="dartIndicator"></div>

        <div id="startScreen" class="overlay">
            <h1>DART MASTER</h1>
            <p>Lemparkan dart ke papan tanpa mengenai dart lain!</p>
            <button id="startBtn">MAIN</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: var(--accent);">GAGAL!</h1>
            <p>Level Tercapai: <span id="finalLevel">1</span></p>
            <p>Skor Akhir: <span id="finalScore">0</span></p>
            <button id="restartBtn">COBA LAGI</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- SETUP CANVAS ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Sizing
            let W, H, centerX, centerY;
            function resizeCanvas() {
                W = $('#gameContainer').width();
                H = $('#gameContainer').height();
                canvas.width = W;
                canvas.height = H;
                centerX = W / 2;
                centerY = H / 2 - 50; // Sedikit di atas tengah
            }
            resizeCanvas();
            $(window).on('resize', resizeCanvas);

            // --- GAME STATE ---
            let state = 'MENU';
            let level = 1;
            let score = 0;
            
            // --- OBJECTS ---
            const wheel = {
                radius: 80,
                angle: 0,
                speed: 0.02,
                direction: 1
            };

            let stuckDarts = []; // Dart yang sudah nancep di wheel
            let flyingDart = null; // Dart yang sedang terbang
            
            // Player stats for level
            let dartsToThrow = 5; // Jumlah dart per level
            let dartsThrown = 0;
            
            // --- LOGIC ---

            function initLevel() {
                stuckDarts = [];
                dartsThrown = 0;
                dartsToThrow = Math.floor(4 + (level / 2)); // Tambah jumlah dart di level tinggi
                wheel.speed = 0.02 + (level * 0.005); // Kecepatan bertambah
                if (Math.random() > 0.5) wheel.direction *= -1; // Random arah
                
                updateDartIndicator();
            }

            function throwDart() {
                if (flyingDart || state !== 'PLAYING') return;
                
                flyingDart = {
                    x: centerX,
                    y: H - 80,
                    speed: 15
                };
            }

            function update() {
                if (state !== 'PLAYING') return;

                // 1. Rotate Wheel
                wheel.angle += wheel.speed * wheel.direction;

                // 2. Move Flying Dart
                if (flyingDart) {
                    flyingDart.y -= flyingDart.speed;

                    // Check Collision with Wheel
                    const dist = Math.hypot(flyingDart.x - centerX, flyingDart.y - centerY);
                    
                    if (dist <= wheel.radius + 10) { // Hit wheel edge
                        checkHit(flyingDart);
                        flyingDart = null;
                    } else if (flyingDart.y < -50) { // Missed completely (should not happen if logic right)
                        flyingDart = null;
                        gameOver();
                    }
                }
            }

            function checkHit(dart) {
                // Hitung sudut relatif dart terhadap roda
                // Kita perlu posisi global dart
                const dx = dart.x - centerX;
                const dy = dart.y - centerY;
                const dist = Math.hypot(dx, dy);
                
                // Tentukan titik tabrakan di tepi roda
                const hitX = dx;
                const hitY = dy;

                // Cek tabrakan dengan dart lain
                // Logika: Hitung sudut absolut dart baru di sistem koordinat roda yang berputar
                // Sudut dart di layar:
                let dartAngle = Math.atan2(dy, dx);
                
                // Normalisasi sudut (0 to 2PI)
                if (dartAngle < 0) dartAngle += 2 * Math.PI;

                // Kita cek jarak sudut dengan dart lain yang sudah nancep
                const collisionRadiusAngle = 0.2; // Toleransi sudut tabrakan (sekitar 11 derajat)
                
                for (let stuck of stuckDarts) {
                    let diff = Math.abs(dartAngle - stuck.angle);
                    if (diff > Math.PI) diff = 2 * Math.PI - diff; // Handle wrap around

                    if (diff < collisionRadiusAngle) {
                        // TABRAKAN!
                        createSparks(dart.x, dart.y);
                        gameOver();
                        return;
                    }
                }

                // TANCEP!
                // Simpan sudut saat ini (relatif terhadap rotasi wheel saat ini)
                // Sebenarnya lebih mudah simpan sudut layar absolut, lalu gambar berputar.
                stuckDarts.push({
                    angle: dartAngle,
                    radius: dist
                });

                dartsThrown++;
                score += 10;
                $('#scoreDisplay').text(score);
                updateDartIndicator();

                // Cek menang level
                if (dartsThrown >= dartsToThrow) {
                    nextLevel();
                }
            }

            function nextLevel() {
                state = 'PAUSED'; // Pause sebentar
                level++;
                $('#levelDisplay').text(level);
                
                // Flash effect
                ctx.fillStyle = "rgba(255,255,255,0.5)";
                ctx.fillRect(0,0,W,H);
                
                setTimeout(() => {
                    initLevel();
                    state = 'PLAYING';
                }, 500);
            }

            let particles = [];
            function createSparks(x, y) {
                for(let i=0; i<10; i++) {
                    particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1.0
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.05;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            // --- DRAW ---
            function draw() {
                ctx.clearRect(0, 0, W, H);

                // Draw Wheel
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(wheel.angle);

                // Log Face
                ctx.fillStyle = '#5c3d2e'; // Dark wood
                ctx.beginPath();
                ctx.arc(0, 0, wheel.radius, 0, Math.PI * 2);
                ctx.fill();

                // Log Texture (Concentric circles)
                ctx.strokeStyle = '#8d5524';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0,0, wheel.radius*0.3, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(0,0, wheel.radius*0.6, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(0,0, wheel.radius*0.9, 0, Math.PI*2); ctx.stroke();

                // Draw Stuck Darts (inside wheel rotation context)
                ctx.fillStyle = '#ddd';
                stuckDarts.forEach(d => {
                    // Kalkulasi posisi x,y dari sudut
                    let x = Math.cos(d.angle) * (wheel.radius - 20);
                    let y = Math.sin(d.angle) * (wheel.radius - 20);
                    
                    // Gambar Dart
                    // Handle
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x - 2, y - 20, 4, 25); // Body simplified
                    // Blade
                    ctx.fillStyle = '#ccc';
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 5, y + 10);
                    ctx.lineTo(x + 5, y + 10);
                    ctx.fill();
                });

                ctx.restore();

                // Draw Flying Dart
                if (flyingDart) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(flyingDart.x - 2, flyingDart.y, 4, 30); // Body
                    ctx.beginPath(); // Blade
                    ctx.moveTo(flyingDart.x, flyingDart.y);
                    ctx.lineTo(flyingDart.x - 6, flyingDart.y + 10);
                    ctx.lineTo(flyingDart.x + 6, flyingDart.y + 10);
                    ctx.fill();
                }

                // Draw Particles
                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 0, 0, ${p.life})`;
                    ctx.fillRect(p.x, p.y, 4, 4);
                });
                if(particles.length > 0) updateParticles();
            }

            function updateDartIndicator() {
                const container = $('#dartIndicator');
                container.empty();
                for(let i=0; i<dartsToThrow; i++) {
                    const div = $('<div class="dart-icon"></div>');
                    if(i < dartsThrown) div.addClass('active'); // Already thrown? Actually opposite. Active means remaining.
                    // Let's fix logic: Grey = Thrown, White = Remaining
                    // So:
                    // if (i >= dartsThrown) addClass('active') -> White
                    if (i >= dartsThrown) div.addClass('active');
                    container.append(div);
                }
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // --- EVENTS ---
            function handleInput(e) {
                if (state === 'PLAYING') {
                    if(e) e.preventDefault();
                    throwDart();
                }
            }

            $('#gameContainer').on('mousedown touchstart', function(e) {
                if ($(e.target).is('button')) return;
                handleInput(e);
            });

            $(document).on('keydown', function(e) {
                if (e.code === 'Space' && state === 'PLAYING') {
                    e.preventDefault();
                    throwDart();
                }
            });

            $('#startBtn').click(function(e) {
                e.stopPropagation();
                startGame();
            });

            $('#restartBtn').click(function(e) {
                e.stopPropagation();
                startGame();
            });

            function startGame() {
                state = 'PLAYING';
                level = 1;
                score = 0;
                particles = [];
                $('#scoreDisplay').text(0);
                $('#levelDisplay').text(1);
                initLevel();
                $('#startScreen').addClass('hidden');
                $('#gameOverScreen').addClass('hidden');
                $('#hud').removeClass('hidden');
            }

            function gameOver() {
                state = 'GAMEOVER';
                flyingDart = null;
                
                setTimeout(() => {
                    $('#finalScore').text(score);
                    $('#finalLevel').text(level);
                    $('#gameOverScreen').removeClass('hidden');
                    $('#hud').addClass('hidden');
                }, 500);
            }

            loop();
        });
    </script>
</body>
</html>
