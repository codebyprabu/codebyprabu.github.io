<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Climb</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f23;
            --player-color: #00ffcc;
            --platform-normal: #4169e1;
            --platform-moving: #ff6b6b;
            --platform-break: #ffd93d;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            max-width: 100vw;
            max-height: 100vh;
            background-color: var(--bg-color);
            border: 2px solid #333;
            overflow: hidden; /* Important for camera logic */
        }

        canvas {
            display: block;
        }

        /* UI */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            text-align: center;
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 2.5rem;
            color: var(--player-color);
            text-shadow: 0 0 10px var(--player-color);
            margin-bottom: 0;
        }

        p { color: #aaa; margin: 10px 0 20px; }

        button {
            padding: 15px 40px;
            font-size: 1rem;
            background: transparent;
            color: var(--player-color);
            border: 2px solid var(--player-color);
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background: var(--player-color); color: #000; }

        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: white;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="scoreDisplay" class="hidden">HEIGHT: 0m</div>

        <div id="startScreen" class="overlay">
            <h1>CYBER CLIMB</h1>
            <p>Naik setinggi mungkin!<br>Jangan jatuh!</p>
            <div style="font-size: 0.9rem; color: #ccc; margin-bottom: 20px;">
                <span style="color:var(--platform-normal)">■</span> Normal<br>
                <span style="color:var(--platform-moving)">■</span> Bergerak<br>
                <span style="color:var(--platform-break)">■</span> Rapuh (Hancur)
            </div>
            <button id="startBtn">START</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: #ff6b6b; text-shadow: 0 0 10px #ff6b6b;">GAME OVER</h1>
            <p>Tinggi Max: <span id="finalHeight">0</span> Meter</p>
            <button id="restartBtn">COBA LAGI</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- SETUP ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 400;
            const H = 600;
            canvas.width = W;
            canvas.height = H;

            // --- GAME STATE ---
            let state = 'MENU';
            let height = 0;
            let highScore = localStorage.getItem('cyberClimbHigh') || 0;

            // --- PHYSICS ---
            let gravity = 0.4;
            let friction = 0.8;

            const player = {
                x: W / 2 - 15,
                y: H - 100,
                width: 30,
                height: 30,
                velX: 0,
                velY: 0,
                speed: 5,
                jumpForce: 10,
                isJumping: false
            };

            let platforms = [];
            let frameCount = 0;

            // --- INPUT ---
            let keys = { left: false, right: false };
            let touchStartX = 0;

            $(document).on('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            });
            $(document).on('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            });

            // Touch Controls (Drag to move)
            $('#gameContainer').on('touchstart', function(e) {
                e.preventDefault();
                touchStartX = e.originalEvent.touches[0].clientX;
            });
            $('#gameContainer').on('touchmove', function(e) {
                e.preventDefault();
                let touchX = e.originalEvent.touches[0].clientX;
                let diff = touchX - touchStartX;
                
                // Instant movement based on drag difference
                player.x += diff * 0.5; 
                
                // Wrap around screen
                if (player.x + player.width < 0) player.x = W;
                if (player.x > W) player.x = -player.width;

                touchStartX = touchX;
            });

            // --- LOGIC ---

            function initGame() {
                player.x = W / 2 - 15;
                player.y = H - 100;
                player.velX = 0;
                player.velY = 0;
                height = 0;
                platforms = [];
                
                // Create initial platforms
                for (let i = 0; i < 8; i++) {
                    createPlatform(H - 100 - (i * 80), i === 0);
                }
                // Add floor base
                platforms.push({ x: 0, y: H - 20, width: W, height: 20, type: 'normal' });
            }

            function createPlatform(y, isStart = false) {
                const w = 70;
                const x = Math.random() * (W - w);
                
                // Types: normal, moving, break
                let type = 'normal';
                if (!isStart && height > 200) {
                    const rand = Math.random();
                    if (rand > 0.9) type = 'moving';
                    else if (rand > 0.8) type = 'break';
                }

                platforms.push({
                    x: x,
                    y: y,
                    width: w,
                    height: 15,
                    type: type,
                    isTouched: false,
                    direction: 1,
                    speed: 2
                });
            }

            function update() {
                if (state !== 'PLAYING') return;

                frameCount++;

                // Controls
                if (keys.left) player.velX = -player.speed;
                else if (keys.right) player.velX = player.speed;
                else player.velX *= friction;

                player.x += player.velX;

                // Screen Wrap (Left/Right)
                if (player.x + player.width < 0) player.x = W;
                if (player.x > W) player.x = -player.width;

                // Physics
                player.velY += gravity;
                player.y += player.velY;

                // Camera Follow Logic
                // If player goes above middle screen, shift everything down
                if (player.y < H / 2) {
                    let shift = (H / 2) - player.y;
                    player.y = H / 2;
                    
                    // Move platforms down
                    for (let p of platforms) {
                        p.y += shift;
                    }
                    
                    height += shift;
                    $('#scoreDisplay').text(`HEIGHT: ${Math.floor(height / 10)}m`);
                }

                // Platform Logic
                for (let i = platforms.length - 1; i >= 0; i--) {
                    let p = platforms[i];

                    // Remove platforms that fall off screen bottom
                    if (p.y > H + 20) {
                        platforms.splice(i, 1);
                        continue;
                    }

                    // Moving Platform Logic
                    if (p.type === 'moving') {
                        p.x += p.speed * p.direction;
                        if (p.x <= 0 || p.x + p.width >= W) p.direction *= -1;
                    }

                    // Collision (Only when falling down)
                    if (player.velY > 0) {
                        if (
                            player.x < p.x + p.width &&
                            player.x + player.width > p.x &&
                            player.y + player.height > p.y &&
                            player.y + player.height < p.y + p.height + player.velY + 5
                        ) {
                            // Land
                            player.velY = -player.jumpForce; // Auto Jump
                            player.y = p.y - player.height;

                            // Break platform logic
                            if (p.type === 'break') {
                                p.isTouched = true;
                                setTimeout(() => {
                                    const idx = platforms.indexOf(p);
                                    if (idx > -1) platforms.splice(idx, 1);
                                }, 100);
                            }
                        }
                    }
                }

                // Spawn new platforms
                // Check top platform
                let topPlatY = Math.min(...platforms.map(p => p.y));
                if (topPlatY > 50) {
                    createPlatform(topPlatY - (Math.random() * 50 + 60));
                }

                // Game Over Check (Fall off bottom)
                if (player.y > H) {
                    gameOver();
                }
            }

            function draw() {
                // BG
                ctx.fillStyle = '#0f0f23';
                ctx.fillRect(0, 0, W, H);

                // Platforms
                for (let p of platforms) {
                    if (p.type === 'normal') ctx.fillStyle = '#4169e1';
                    else if (p.type === 'moving') ctx.fillStyle = '#ff6b6b';
                    else if (p.type === 'break') ctx.fillStyle = p.isTouched ? '#ff0000' : '#ffd93d';

                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Shine effect
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(p.x, p.y, p.width, 4);
                }

                // Player
                ctx.fillStyle = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffcc';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                
                // Player Eyes
                ctx.fillStyle = '#000';
                ctx.shadowBlur = 0;
                ctx.fillRect(player.x + 5, player.y + 8, 6, 6);
                ctx.fillRect(player.x + 19, player.y + 8, 6, 6);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            function gameOver() {
                state = 'GAMEOVER';
                let finalM = Math.floor(height / 10);
                if (finalM > highScore) {
                    highScore = finalM;
                    localStorage.setItem('cyberClimbHigh', highScore);
                }
                $('#finalHeight').text(`${finalM} M (Rekor: ${highScore} M)`);
                $('#gameOverScreen').removeClass('hidden');
                $('#scoreDisplay').addClass('hidden');
            }

            function startGame() {
                state = 'PLAYING';
                initGame();
                $('#startScreen').addClass('hidden');
                $('#gameOverScreen').addClass('hidden');
                $('#scoreDisplay').removeClass('hidden');
            }

            $('#startBtn').click(startGame);
            $('#restartBtn').click(startGame);

            // Start loop
            loop();
        });
    </script>
</body>
</html>
